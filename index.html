<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="club-logo.png">
        <link rel="stylesheet" href="output.css">
        <link rel="stylesheet" href="style.css">

        <style>
            @import "tailwindcss";
        </style>
    </head>
    <body>
        <button id="image-upload" aria-label="Take a photo">
            <svg id = "camera-icon" viewBox="0 0 64 64" width=80 height=80 fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="8" y="20" width="48" height="34" rx="5" stroke="rgba(96,165,250,0.9)" strokeWidth="2.5"/>
                <circle cx="32" cy="37" r="10" stroke="rgba(96,165,250,0.9)" strokeWidth="2.5"/>
                <circle cx="32" cy="37" r="5" fill="rgba(96,165,250,0.25)" stroke="rgba(96,165,250,0.55)" strokeWidth="1.5"/>
                <path d="M24 20 L24 15 Q24 13 26 13 L38 13 Q40 13 40 15 L40 20" stroke="rgba(96,165,250,0.9)" strokeWidth="2.5" strokeLinejoin="round"/>
                <circle cx="50" cy="28" r="2.5" fill="rgba(96,165,250,0.7)" />
            </svg>
        </button>
        <div id="guide-container">
            <p class="guide-title">
                How to capture
            </p>

            <div class="guide-step">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <rect x="3" y="6" width="18" height="13" rx="2" stroke="rgba(96,165,250,0.8)" stroke-width="1.5"/>
                <rect x="8" y="3" width="8" height="3" rx="1" stroke="rgba(96,165,250,0.8)" stroke-width="1.5"/>
                <circle cx="12" cy="13" r="3.5" stroke="rgba(96,165,250,0.8)" stroke-width="1.5"/>
                </svg>
                <span class="guide-step-desc">
                Place number on a flat, well-lit surface
                </span>
            </div>

            <div class="guide-step">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <rect x="4" y="4" width="16" height="16" rx="2" stroke="rgba(96,165,250,0.8)" stroke-width="1.5" stroke-dasharray="3 2"/>
                <rect x="8" y="8" width="8" height="8" rx="1" fill="rgba(96,165,250,0.15)" stroke="rgba(96,165,250,0.8)" stroke-width="1.5"/>
                </svg>
                <span class="guide-step-desc">
                Fill the frame and keep the number centered
                </span>
            </div>

            <div class="guide-step">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <circle cx="12" cy="12" r="8" stroke="rgba(96,165,250,0.8)" stroke-width="1.5"/>
                <line x1="12" y1="8" x2="12" y2="12" stroke="rgba(96,165,250,0.8)" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="12" y1="12" x2="15" y2="14" stroke="rgba(96,165,250,0.8)" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span class="guide-step-desc">
                Hold still—avoid blur and harsh shadows
                </span>
            </div>
        </div>
        <p id="ya"></p>
        <img id="image" src="test.png" crossorigin="anonymous"  width="100" height="100">
        
        <script type="module" src="script.js">
        </script>
    </body>
</html>
